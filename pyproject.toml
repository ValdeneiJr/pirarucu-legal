[project]
name = "pirarucu-legal"
version = "0.1.0"
description = "Rastreabilidade do pirarucu de manejo com blockchain local e contrato inteligente (AP1 - Oficina 3)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "requests>=2.34.2",
    "streamlit>=1.64.0",
    "uvicorn>=0.54.0",
]

# Instala a pasta pirarucu/ como pacote, para os imports funcionarem também no `streamlit run`
[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pirarucu"
module-root = ""

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx`"]
